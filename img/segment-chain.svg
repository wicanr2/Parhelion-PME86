<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"
     font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="17" fill="#222">跨段呼叫穿過的三層間接（8086 版實際的欄位偏移）</text>

  <!-- segment number -->
  <rect x="30" y="72" width="130" height="44" rx="7" fill="#fdf3e8" stroke="#d97b29" stroke-width="1.4"/>
  <text x="95" y="93" font-size="13.5" fill="#8a4a10" text-anchor="middle">segment number</text>
  <text x="95" y="110" font-size="12" fill="#8a4a10" text-anchor="middle">（p-code 的運算元）</text>

  <!-- E_Vec -->
  <rect x="200" y="62" width="150" height="120" rx="7" fill="#fafafa" stroke="#bbb"/>
  <text x="275" y="82" font-size="13.5" fill="#333" text-anchor="middle">E_Vec</text>
  <text x="275" y="100" font-size="11.5" fill="#777" text-anchor="middle">ss:3Ah</text>
  <line x1="212" y1="110" x2="338" y2="110" stroke="#ddd"/>
  <text x="275" y="128" font-size="12" fill="#555" text-anchor="middle">[0] [1] [2] …</text>
  <text x="275" y="152" font-size="12" fill="#555" text-anchor="middle">以段號索引的</text>
  <text x="275" y="168" font-size="12" fill="#555" text-anchor="middle">E_Rec 指標陣列</text>

  <!-- E_Rec -->
  <rect x="392" y="62" width="190" height="120" rx="7" fill="#fdf3e8" stroke="#d97b29" stroke-width="1.4"/>
  <text x="487" y="82" font-size="13.5" fill="#8a4a10" text-anchor="middle">E_Rec</text>
  <line x1="404" y1="92" x2="570" y2="92" stroke="#eccfae"/>
  <text x="412" y="112" font-size="12.5" fill="#8a4a10" font-family="monospace">+0</text>
  <text x="450" y="112" font-size="12.5" fill="#8a4a10">Env_Data　全域資料</text>
  <text x="412" y="138" font-size="12.5" fill="#8a4a10" font-family="monospace">+2</text>
  <text x="450" y="138" font-size="12.5" fill="#8a4a10">E_Vec</text>
  <text x="412" y="164" font-size="12.5" fill="#8a4a10" font-family="monospace">+4</text>
  <text x="450" y="164" font-size="12.5" fill="#8a4a10">SIB</text>

  <!-- SIB -->
  <rect x="624" y="62" width="180" height="120" rx="7" fill="#fafafa" stroke="#bbb"/>
  <text x="714" y="82" font-size="13.5" fill="#333" text-anchor="middle">SIB</text>
  <line x1="636" y1="92" x2="792" y2="92" stroke="#ddd"/>
  <text x="642" y="112" font-size="12.5" fill="#555" font-family="monospace">+0</text>
  <text x="680" y="112" font-size="12.5" fill="#555">Seg_Base（2 word）</text>
  <text x="642" y="138" font-size="12.5" fill="#555" font-family="monospace">+4</text>
  <text x="680" y="138" font-size="12.5" fill="#555">Ref_Count</text>
  <text x="642" y="164" font-size="12.5" fill="#555" font-family="monospace">+6</text>
  <text x="680" y="164" font-size="12.5" fill="#555">Activity</text>

  <path d="M160 94 L192 100" stroke="#5a5a5a" fill="none" marker-end="url(#c)"/>
  <path d="M350 122 L384 122" stroke="#5a5a5a" fill="none" marker-end="url(#c)"/>
  <path d="M582 164 L616 140" stroke="#5a5a5a" fill="none" marker-end="url(#c)"/>

  <text x="822" y="118" font-size="12" fill="#8a4a10">高位字為 0</text>
  <text x="822" y="136" font-size="12" fill="#8a4a10">＝ 不在記憶體</text>
  <text x="822" y="154" font-size="12" fill="#8a4a10">→ segment fault</text>

  <!-- 程式碼段 -->
  <line x1="30" y1="212" x2="930" y2="212" stroke="#e0e0e0"/>
  <text x="30" y="242" font-size="15" fill="#222">Seg_Base 指到的程式碼段，開頭三個欄位餵給三個狀態變數</text>

  <rect x="30" y="262" width="300" height="140" rx="7" fill="#fafafa" stroke="#bbb"/>
  <text x="180" y="284" font-size="13.5" fill="#333" text-anchor="middle">已載入的程式碼段</text>
  <line x1="42" y1="294" x2="318" y2="294" stroke="#ddd"/>
  <text x="46" y="316" font-size="12.5" fill="#555" font-family="monospace">+0x00</text>
  <text x="120" y="316" font-size="12.5" fill="#555">程序字典的 word 偏移</text>
  <text x="46" y="344" font-size="12.5" fill="#555" font-family="monospace">+0x0c</text>
  <text x="120" y="344" font-size="12.5" fill="#555">byte sex 旗標</text>
  <text x="46" y="372" font-size="12.5" fill="#555" font-family="monospace">+0x0e</text>
  <text x="120" y="372" font-size="12.5" fill="#555">常數池的 word 偏移</text>

  <g font-size="13">
    <rect x="400" y="262" width="230" height="38" rx="6" fill="#fdf3e8" stroke="#d97b29" stroke-width="1.3"/>
    <text x="414" y="286" fill="#8a4a10" font-family="monospace">ss:36h</text>
    <text x="500" y="286" fill="#8a4a10">程序字典基底</text>

    <rect x="400" y="312" width="230" height="38" rx="6" fill="#fdf3e8" stroke="#d97b29" stroke-width="1.3"/>
    <text x="414" y="336" fill="#8a4a10" font-family="monospace">ss:44h</text>
    <text x="500" y="336" fill="#8a4a10">byte sex</text>

    <rect x="400" y="362" width="230" height="38" rx="6" fill="#fdf3e8" stroke="#d97b29" stroke-width="1.3"/>
    <text x="414" y="386" fill="#8a4a10" font-family="monospace">ss:42h</text>
    <text x="500" y="386" fill="#8a4a10">常數池基底</text>
  </g>
  <path d="M330 312 L392 281" stroke="#5a5a5a" fill="none" marker-end="url(#c)"/>
  <path d="M330 340 L392 331" stroke="#5a5a5a" fill="none" marker-end="url(#c)"/>
  <path d="M330 368 L392 381" stroke="#5a5a5a" fill="none" marker-end="url(#c)"/>
  <text x="400" y="426" font-size="12" fill="#777">兩個 word 偏移都先乘二才存進去。</text>

  <text x="668" y="286" font-size="13" fill="#444">程序字典往回長：</text>
  <text x="668" y="312" font-size="13.5" fill="#333" font-family="monospace">字典基底 − 2×程序號</text>
  <text x="668" y="344" font-size="13" fill="#444">字典項為 0 就是錯誤。</text>
  <text x="668" y="376" font-size="13" fill="#8a4a10">CPL 與 CPG 只差在推</text>
  <text x="668" y="396" font-size="13" fill="#8a4a10">MP 還是 BASE 當靜態鏈。</text>
</svg>
